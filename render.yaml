services:
  - type: web
    name: nascente-brasil-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -e ".[api]"
    startCommand: python scripts/bootstrap_cloud_database.py && uvicorn nascente_brasil.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NASCENTE_POSTGRES_DSN
        fromDatabase:
          name: nascente-brasil-db
          property: connectionString

databases:
  - name: nascente-brasil-db
    plan: free
    region: ohio
    databaseName: nascente_brasil
    user: nascente
