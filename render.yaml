services:
  - type: web
    name: nascente-brasil-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements-api.txt
    startCommand: python scripts/bootstrap_cloud_database.py && uvicorn nascente_brasil.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONPATH
        value: src
      - key: NASCENTE_POSTGRES_DSN
        fromDatabase:
          name: nascente-brasil-db
          property: connectionString

databases:
  - name: nascente-brasil-db
    plan: free
    region: ohio
    databaseName: nascente_brasil
    user: nascente
