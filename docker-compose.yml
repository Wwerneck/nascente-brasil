services:
  postgres:
    image: postgres:16
    container_name: nascente_brasil_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nascente_brasil}
      POSTGRES_USER: ${POSTGRES_USER:-nascente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nascente}
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nascente} -d ${POSTGRES_DB:-nascente_brasil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/nascente/src
      NASCENTE_DATA_DIR: /opt/nascente/data
      NASCENTE_METADATA_DIR: /opt/nascente/data/metadata
      NASCENTE_LOG_DIR: /opt/nascente/logs
      NASCENTE_MANIFEST_PATH: /opt/nascente/data/metadata/ingestion_manifest.csv
      NASCENTE_POSTGRES_DSN: postgresql://nascente:nascente@postgres:5432/nascente_brasil
      NASCENTE_POSTGRES_HOST: postgres
      NASCENTE_POSTGRES_PORT: 5432
      NASCENTE_POSTGRES_USER: nascente
      NASCENTE_POSTGRES_PASSWORD: nascente
      NASCENTE_POSTGRES_DATABASE: nascente_brasil
    command: ["bash", "-c", "python scripts/build_birth_indicators.py && python scripts/run_phase_11.py && python scripts/validate_phase_11.py && /home/airflow/dbt-venv/bin/dbt build --project-dir dbt --profiles-dir dbt"]
    volumes:
      - ./data:/opt/nascente/data
      - ./logs:/opt/nascente/logs

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      pipeline-init:
        condition: service_completed_successfully
    environment:
      NASCENTE_POSTGRES_DSN: postgresql://nascente:nascente@postgres:5432/nascente_brasil
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      NASCENTE_API_URL: http://api:8000
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      pipeline-init:
        condition: service_completed_successfully
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nascente:nascente@postgres:5432/nascente_brasil
      AIRFLOW__WEBSERVER__SECRET_KEY: nascente-local-only
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: ["bash", "-c", "airflow db migrate && airflow users create --username admin --password admin --firstname Nascente --lastname Brasil --role Admin --email admin@localhost || true"]
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./data:/opt/nascente/data
      - ./logs:/opt/nascente/logs

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: scheduler
    volumes: *airflow-volumes
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes: *airflow-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
