[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nascente-brasil"
version = "0.1.0"
description = "Plataforma nacional de dados materno-infantis."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "odfpy>=1.4,<2",
    "datasus-dbc>=0.1.3,<0.2",
    "dbfread>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
api = ["fastapi>=0.141,<1", "uvicorn>=0.53,<1"]
dashboard = ["streamlit>=1.64,<2", "plotly>=6.9,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
